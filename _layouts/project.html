---
layout: academic
---
<article class="project-detail">
  <a class="project-back" href="{{ '/projects/' | relative_url }}">&larr; All projects</a>
  <header class="project-header">
    <p class="project-context">{{ page.course }} <span aria-hidden="true">&middot;</span> {{ page.period }}</p>
    <h1>{{ page.title }}</h1>
    <p class="project-kind">{{ page.context }}</p>
    <a class="project-report" href="{{ page.report | relative_url }}">Archived course report (PDF)</a>
  </header>
  <div class="project-body">
    {{ content }}
  </div>
  <div class="project-credit">
    <p><strong>{{ page.team_label | default: 'Project team' }}:</strong>&nbsp;{{ page.authors | join: ', ' }}.</p>
  </div>
</article>
